name: Build, Test, and Deploy to AWS

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: learn2program-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  AWS_REGION: "eu-west-1"
  APPLICATION_NAME: "learn2program"
  ENVIRONMENT_NAME: "learn2program-prod"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: learn2program_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: learn2code
      DB_DIALECT: mysql
      SESSION_SECRET: test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    needs:
      - test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Elastic Beanstalk
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1
        with:
          aws-region: ${{ env.AWS_REGION }}
          application-name: ${{ env.APPLICATION_NAME }}
          environment-name: ${{ env.ENVIRONMENT_NAME }}
          version-label: ${{ github.sha }}
          wait-for-deployment: true
          wait-for-environment-recovery: true

      - name: Smoke test
        run: |
          CNAME=$(aws elasticbeanstalk describe-environments \
            --application-name "${APPLICATION_NAME}" \
            --environment-names "${ENVIRONMENT_NAME}" \
            --query 'Environments[0].CNAME' \
            --output text)

          echo "Environment: http://${CNAME}"

          curl \
            --fail \
            --retry 10 \
            --retry-delay 5 \
            --retry-connrefused \
            "http://${CNAME}/health"
